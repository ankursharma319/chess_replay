[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-replay"
version = "0.1.0"
description = "Turn public Chess.com games into replay videos and publish them to YouTube."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.0,<3",
    "google-auth-oauthlib>=1.2,<2",
    "httpx>=0.28,<1",
    "Pillow>=11,<13",
    "pydantic-settings>=2.10,<3",
    "python-chess>=1.999,<2",
    "reportlab>=4,<5",
    "svglib>=1.6,<2",
]

[project.scripts]
chess-replay = "chess_replay.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]